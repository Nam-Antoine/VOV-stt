[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-stt-corpus"
version = "0.1.0"
description = "VOV2 Đàn bà 30+ verbatim speech corpus — API, worker and CPU ASR pipeline"
requires-python = ">=3.11"
license = { text = "Proprietary — client-owned; see LICENSE-NOTICE.md" }

# PLAN §6. No `anthropic`, no `openai`, no LLM client of any kind: CLAUDE.md rule 7.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",     # multipart upload
    "itsdangerous>=2.2",           # signed session cookie
    "sherpa-onnx>=1.12",           # ASR + VAD + diarization runtime (Apache-2.0)
    "onnxruntime>=1.18",           # readable layer: ViBERT-capu punctuation (MIT)
    "fpdf2>=2.7",                  # readable PDF export (LGPL-3.0)
    "numpy>=1.26",
    "soundfile>=0.12",
    "sentencepiece>=0.2",
    "huggingface_hub>=0.24",       # scripts/download_models.py
    # Google Sheet + Docs repository (GOOGLE_REPO_PLAN). Google's API clients, not LLMs.
    "google-api-python-client>=2.140",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",                 # FastAPI TestClient
    "ruff>=0.5",
]
# Pilot only (PLAN §4.2) — not installed in the runtime image.
pilot = [
    "jiwer>=3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E701",   # PLAN §2.2 reference code uses one-line `if cur: ...`; kept verbatim
    "E702",
    "B008",   # `x = Depends(...)` in a signature is the FastAPI idiom, not a bug
]

[tool.ruff.lint.per-file-ignores]
# PLAN §2.2 reference code is kept exactly as the plan wrote it, including its
# one-line `if cur:`, its dict() call and its unstrict zip(). Rewriting it to suit
# the linter would make it impossible to diff against the plan.
"app/pipeline/asr.py" = ["E501", "C408", "B905"]
# Raw OOXML: the long lines are w3c/openxmlformats namespace URIs inside string
# literals. They cannot be wrapped without corrupting the document.
"app/exports/docx.py" = ["E501"]
